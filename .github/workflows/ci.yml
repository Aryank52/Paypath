name: PayPath Continuous Integration & Production Quality Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  hygiene-audit:
    name: Secrets, Leak Prevention & Git Hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify No Secrets or Dotenv Committed
        run: |
          echo "Checking repository for prohibited .env files..."
          if git ls-files | grep -E '(^|/)\.env(\.(local|production|development|test|staging|secret))?$'; then
            echo "ERROR: Tracked .env credentials file detected in git tree!"
            exit 1
          fi
          echo "Verified: No .env credentials files committed."

  backend-test:
    name: Backend Test Suite & Isolation Verification
    runs-on: ubuntu-latest
    needs: hygiene-audit
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Backend Pytest Suite
        env:
          APP_ENV: 'test'
          SECRET_KEY: 'test-secret-key-326ebfdb-5cc7-4b18-a149'
          DATABASE_URL: 'sqlite+aiosqlite:///:memory:'
          PAYPAL_MODE: 'sandbox'
        run: |
          python -m pytest backend/tests -v

  frontend-build:
    name: Frontend Typecheck & Production Build
    runs-on: ubuntu-latest
    needs: hygiene-audit
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: TypeScript Typecheck & Production Bundle
        run: |
          cd frontend
          npm run build
